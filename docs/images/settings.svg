  <text x="138" y="310" fill="#5C6778" font-family="Segoe UI, sans-serif" font-size="13">Calculator is the default. Pick any preset or browse for a .exe.</text>

  <rect x="138" y="328" width="186" height="58" rx="8" fill="#E8F1FA" stroke="#1D4E89"/>
