name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish portable zip
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterCopilotButton-win-x64
          path: artifacts/BetterCopilotButton-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/BetterCopilotButton-win-x64.zip
          generate_release_notes: true
          draft: false
          body: |
            Portable Windows x64 build. Unzip and run `BetterCopilotButton.exe`.

            1. Open the app
            2. Leave **Calculator** selected, or pick any other app
            3. Turn **Enable** on
            4. Press the Copilot key

            No admin prompt. Uninstall from the app or `uninstall.ps1` to restore the Copilot key.
